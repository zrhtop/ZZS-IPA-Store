<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>圣诞雪球人</title>
  <link rel="stylesheet" href="controls.css">
  <script>window.RufflePlayer={config:{autoplay:'on',unmuteOverlay:'hidden',splashScreen:false,showSwfDownload:false,contextMenu:'off',allowScriptAccess:true,letterbox:'on',logLevel:'error',quality:'high',scale:'showAll',forceScale:true,preferredRenderer:'webgl'}};</script>
  <script src="runtime/ruffle.js" defer></script>
  <script src="controls-layout.js" defer></script>
  <script src="host.js" defer></script>
</head>
<body>
  <main id="play-area" aria-label="圣诞雪球人游戏">
    <aside class="rail left-rail" aria-label="方向控制">
      <div class="dpad">
        <button class="control up-left" data-control="up-left" data-keys="37,38" aria-label="左上">↖</button>
        <button class="control up" data-control="38" data-key="38" aria-label="向上跳跃">▲</button>
        <button class="control up-right" data-control="up-right" data-keys="39,38" aria-label="右上">↗</button>
        <button class="control left" data-control="37" data-key="37" aria-label="向左移动">◀</button>
        <button class="control right" data-control="39" data-key="39" aria-label="向右移动">▶</button>
        <button class="control down-left" data-control="down-left" data-keys="37,40" aria-label="左下">↙</button>
        <button class="control down" data-control="40" data-key="40" aria-label="向下穿过平台">▼</button>
        <button class="control down-right" data-control="down-right" data-keys="39,40" aria-label="右下">↘</button>
      </div>
    </aside>
    <div id="stage-area"><div id="game" aria-label="原版游戏画面"></div></div>
    <aside class="rail right-rail" aria-label="射击和辅助控制">
      <button id="settings" class="settings" aria-label="辅助设置" title="辅助设置">⚙</button>
      <button class="control fire" data-control="32" data-key="32" aria-label="按住射击">射击</button>
      <span id="cheat-indicator" aria-live="polite" hidden>无限生命</span>
    </aside>
  </main>
  <div id="settings-backdrop" hidden></div>
  <dialog id="cheat-dialog" aria-labelledby="cheat-title">
    <h1 id="cheat-title">辅助设置</h1>
    <label class="cheat-option"><span>无限生命</span><input id="cheat-switch" type="checkbox" role="switch"></label>
    <p>默认关闭。开启后，受伤不会消耗生命。</p>
    <label class="cheat-option invincible-option"><span>无敌</span><input id="invincible-switch" type="checkbox" role="switch"></label>
    <p>默认关闭。免疫敌人伤害，并保留道具强化。</p>
    <div class="layout-setting">
      <h2>虚拟按键</h2>
      <p>每个按键都可拖动位置、单独调整大小。</p>
      <button id="adjust-controls">调整按键布局</button>
    </div>
    <button id="close-settings">返回游戏</button>
  </dialog>
  <section id="layout-editor" aria-label="按键布局编辑" hidden>
    <div class="editor-heading"><strong>调整按键</strong><span>拖动位置 · 点选后调整大小</span></div>
    <div class="control-picker" aria-label="选择按键">
      <button data-select-control="up-left" aria-label="选择左上">↖</button>
      <button data-select-control="38" aria-label="选择跳跃">▲</button>
      <button data-select-control="up-right" aria-label="选择右上">↗</button>
      <button data-select-control="37" aria-label="选择左移">◀</button>
      <button data-select-control="39" aria-label="选择右移">▶</button>
      <button data-select-control="down-left" aria-label="选择左下">↙</button>
      <button data-select-control="40" aria-label="选择下落">▼</button>
      <button data-select-control="down-right" aria-label="选择右下">↘</button>
      <button data-select-control="32" aria-label="选择射击">射击</button>
    </div>
    <div class="size-setting">
      <span id="selected-control-name"></span>
      <button id="control-smaller" aria-label="缩小选中的按键">−</button>
      <input id="control-size" type="range" min="44" max="120" step="1" aria-label="选中按键大小">
      <button id="control-larger" aria-label="放大选中的按键">＋</button>
      <output id="control-size-value" for="control-size"></output>
    </div>
    <div class="editor-actions">
      <button id="reset-selected-position">当前键归位</button>
      <button id="reset-layout">恢复默认</button>
      <button id="cancel-layout">取消</button>
      <button id="save-layout">保存布局</button>
    </div>
  </section>
  <div id="fatal-error" role="alert" hidden></div>
</body>
</html>
