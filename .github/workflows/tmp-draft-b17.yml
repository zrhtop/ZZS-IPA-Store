name: Convert b17 to draft (temporary)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Convert release to draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -X PATCH -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/zrhtop/ZZS-IPA-Store/releases/427346528 -d '{"draft": true}'
          echo '--- verify ---'
          curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/zrhtop/ZZS-IPA-Store/releases/427346528 | grep -E '"draft"|"tag_name"'
