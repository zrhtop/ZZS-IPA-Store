name: Import AltStore Source

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: '完整 HTTPS 软件源地址，例如 https://example.com/source.json'
        type: string
        required: true
      import_mode:
        description: '已有应用处理方式'
        type: choice
        required: true
        default: add-only
        options:
          - add-only
          - merge-versions
      bundle_ids:
        description: '可选：仅导入指定 Bundle ID，多个用英文逗号隔开。留空导入全部。'
        type: string
        required: false
        default: ''
      preview_only:
        description: '仅预览，不修改软件源'
        type: boolean
        required: true
        default: false
      permission_confirm:
        description: '我确认有权导入这些应用信息，并遵守原始软件源的许可与条款'
        type: boolean
        required: true
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: zzs-ipa-store-pages
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.imported.outputs.publish }}
    steps:
      - name: Confirm third-party source import is authorized
        env:
          PERMISSION_CONFIRMED: ${{ inputs.permission_confirm }}
        shell: bash
        run: |
          if [ "$PERMISSION_CONFIRMED" != "true" ]; then
            echo "::error::请确认你有权使用和导入这个软件源。"
            exit 1
          fi

      - name: Checkout current source
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install JSON5 support
        run: python -m pip install --disable-pip-version-check json5==0.12.1

      - name: Import upstream source
        id: imported
        shell: bash
        env:
          SOURCE_URL: ${{ inputs.source_url }}
          IMPORT_MODE: ${{ inputs.import_mode }}
          BUNDLE_IDS: ${{ inputs.bundle_ids }}
          PREVIEW: ${{ inputs.preview_only }}
        run: |
          args=(--url "$SOURCE_URL" --mode "$IMPORT_MODE" --bundle-ids "$BUNDLE_IDS")
          if [ "$PREVIEW" = "true" ]; then
            args+=(--preview)
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          python scripts/import_source.py "${args[@]}"

      - name: Commit merged source
        if: steps.imported.outputs.publish == 'true'
        shell: bash
        run: |
          if ! git diff --quiet -- docs/source.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/source.json
            git commit -m "Import approved AltStore source metadata [skip ci]"
            git push origin HEAD:main
          else
            echo "No source changes."
          fi

      - name: Configure GitHub Pages
        if: steps.imported.outputs.publish == 'true'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: steps.imported.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs

  deploy:
    if: needs.import.outputs.publish == 'true'
    runs-on: ubuntu-latest
    needs: import
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy updated AltStore source
        id: deployment
        uses: actions/deploy-pages@v4
