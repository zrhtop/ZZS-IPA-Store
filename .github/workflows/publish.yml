name: Publish ZZS IPA Store

on:
  release:
    types:
      - published
      - edited
      - deleted
      - unpublished
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: zzs-ipa-store-pages
  cancel-in-progress: false

jobs:
  dispatch:
    # Release events fire on a tag ref; deployments from that ref
    # report success but never reach the live site (verified
    # 2026-10-29, run #59). Relay them into a workflow_dispatch run
    # on main, the path that provably updates the site.
    # workflow_dispatch is exempt from the GITHUB_TOKEN
    # no-recursion rule, so this creates a real follow-up run.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Re-dispatch publish from main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run publish.yml --repo ${{ github.repository }} --ref main

  build:
    if: github.event_name != 'release' && (github.event_name != 'push' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Synchronize source from public GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/sync_releases.py

      - name: Commit updated source.json
        shell: bash
        run: |
          if ! git diff --quiet -- docs/source.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/source.json
            git commit -m "Sync AltStore source with published GitHub Releases [skip ci]"
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs

  deploy:
    if: github.event_name != 'release'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
